plugins {
    id("org.jetbrains.kotlin.android")
    id 'com.android.application'
}

android {
    namespace 'com.ownroot.wrapper'
    compileSdk 36

    defaultConfig {
        applicationId "com.ownroot.wrapper"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// Ноль внешних зависимостей: adb-ядро и UI — собственные исходники.
dependencies {
}
