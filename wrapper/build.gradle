plugins {
    id("org.jetbrains.kotlin.android")
    id 'com.android.application'
}

android {
    namespace 'com.ownroot.wrapper'
    compileSdk 36

    defaultConfig {
        applicationId "com.ownroot.wrapper"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        wrapper {
            storeFile file('ownroot.keystore')
            storePassword 'android'
            keyAlias 'ownroot'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.wrapper
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    packagingOptions {
        resources {
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            excludes += 'META-INF/OSGI-INF/MANIFEST.MF'
            excludes += 'META-INF/*.SF'
            excludes += 'META-INF/*.DSA'
            excludes += 'META-INF/*.RSA'
        }
    }
}

// adb-ядро собственное; Shizuku API — единственная внешняя зависимость (канал юзера).
dependencies {
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    implementation 'dev.rikka.shizuku:api:13.1.0'
    implementation 'dev.rikka.shizuku:provider:13.1.0'
}
