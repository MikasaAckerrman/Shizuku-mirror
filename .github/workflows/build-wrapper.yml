name: Build Wrapper

on:
  workflow_dispatch:
  push:
    branches: [ feat/root-wrapper ]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (с сабмодулями — api/ нужен root-скрипту)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build wrapper APK (release)
        run: ./gradlew -p wrapper assembleRelease --no-daemon -q

      - name: Upload release asset (артефакт-квота исчерпана)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: wrapper-${{ github.run_number }}
        run: |
          APK=$(ls wrapper/build/outputs/apk/release/*.apk | head -1)
          gh release create "$TAG" "$APK" --title "ownroot wrapper build ${{ github.run_number }}" --notes "autobuild feat/root-wrapper" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
