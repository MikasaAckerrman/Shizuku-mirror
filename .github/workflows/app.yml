name: App

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE'

# [quota-workaround] artifacts hit the storage quota; release assets do not
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
          echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
          echo KEYSTORE_FILE=../key.jks >> signing.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Build with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          # [fast-tests] branches build debug-only (no R8/shrinkResources, single
          # native variant, timing logs active); master builds the full release.
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "Building FULL release (master)"
            ./gradlew :manager:assembleRelease
          else
            echo "Building FAST debug (test branch)"
            ./gradlew :manager:assembleDebug
          fi
      - name: Upload APK as release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          APK=$(ls manager/build/outputs/apk/debug/shizuku*-debug.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls manager/build/outputs/apk/release/shizuku*-v*-release.apk | head -1)
          echo "APK: $APK"
          RELEASE_ID=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/releases \
            -d '{"tag_name":"ci-apk-'"$RUN_ID"'","name":"CI APK r'"$RUN_NUM"'","body":"Automated branch build (starter-engine)","prerelease":true}' | jq -r '.id')
          echo "release id: $RELEASE_ID"
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$(basename "$APK")"
          echo "uploaded: $(basename "$APK")"
